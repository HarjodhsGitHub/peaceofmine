[env:seeed_xiao_esp32c6]
platform = espressif32@^7.0.1
board = seeed_xiao_esp32c6
framework = espidf

monitor_speed = 115200
upload_speed = 460800

; XIAO D0 is GPIO0. Change this to 1 for D1 or 2 for D2 if needed.
build_flags =
    -D ADC_INPUT_GPIO=0
    -D ADC_SAMPLE_RATE_HZ=100000
    -D WAVEFORM_REPORT_INTERVAL_MS=5000
    -D WAVEFORM_SAMPLE_COUNT=256
