[env:seeed_xiao_esp32c6]
; 6.11.0 added the XIAO ESP32-C6 board and uses the stable ESP-IDF 5.4 toolchain.
; The current 7.x/ESP-IDF 6 build path produces a broken C6 image in PlatformIO.
platform = espressif32@6.11.0
board = seeed_xiao_esp32c6
framework = espidf

monitor_speed = 115200
upload_speed = 460800

; XIAO D0 is GPIO0. Change this to 1 for D1 or 2 for D2 if needed.
build_flags =
    -D ADC_INPUT_GPIO=0
    ; ESP-IDF 5.4 limits the C6 continuous ADC driver to 83,333 S/s.
    -D ADC_SAMPLE_RATE_HZ=80000
    -D WAVEFORM_REPORT_INTERVAL_MS=5000
    -D WAVEFORM_SAMPLE_COUNT=256
